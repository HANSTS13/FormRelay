<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Scholarship Form</title><style>body{font-family:system-ui;max-width:570px;margin:30px auto;padding:20px}label{display:block;margin-top:18px}input,select{box-sizing:border-box;display:block;width:100%;padding:12px;margin-top:6px;font-size:1rem;background:white;border:1px solid #767676;border-radius:4px}button{padding:12px;margin-top:24px;font-size:1rem;cursor:pointer}</style></head><body><h1>Scholarship Application (Demo)</h1><p>Use test data only. Activate FormRelay in Chrome to select guardian fields.</p><form id="scholarship"><label>Student Name<input id="student_name" type="text" value="Demo Student"></label><label>Guardian Full Name<input id="guardian_name" type="text"></label><label>Guardian Relationship<select id="guardian_relationship"><option value="">-- Select Relationship --</option><option value="Mother">Mother</option><option value="Father">Father</option><option value="Legal Guardian">Legal Guardian</option><option value="Grandparent">Grandparent</option><option value="Other">Other</option></select></label><label>Guardian Occupation<input id="guardian_job" type="text"></label><label>Guardian Phone<input id="guardian_phone" type="tel"></label><label>Annual Family Income<input id="family_income" type="number"></label><button type="submit">Submit demo</button></form><script src="/demo.js"></script></body></html>
